[project]
name = "textbook-mcp"
version = "0.1.0"
description = "MCP server for a local PDF textbook corpus (hybrid search + rerank)"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "mcp",
    "pymupdf",
    "numpy",
]

[project.optional-dependencies]
# Semantic layer. Without these the server runs with BM25 only.
dense = [
    "sentence-transformers>=3",
    "torch",
]

[project.scripts]
textbook-mcp = "tbmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tbmcp"]
